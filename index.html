<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnolia Research</title>
  <meta name="description" content="Magnolia Research helps AI labs push their frontier model capabilities by building targeted post-training data and reinforcement learning environments grounded in real engineering and research workflows." />
  <style>
    :root {
      --bg: #f7f4ee;   /* warm off-white */
      --ink: #33403a;  /* deep muted green */
      --magnolia-opacity: 0.22;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 40rem;
      width: 100%;
      padding: 3rem 1.5rem;
      text-align: center;
      animation: fade-in 1.4s ease both;
    }

    .magnolia {
      position: fixed;
      right: -1vw;
      bottom: -2vh;
      width: min(66vw, 900px);
      height: min(80vh, 880px);
      z-index: 0;
      pointer-events: none;
      user-select: none;
      overflow: hidden;
    }

    .magnolia-art {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: magnolia-appear 2.4s ease 0.45s forwards;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .magnolia-veil {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse 100% 100% at 100% 100%,
        transparent 0%,
        transparent 38%,
        rgba(247, 244, 238, 0.55) 68%,
        var(--bg) 92%
      );
    }

    .magnolia-ascii {
      position: absolute;
      right: 0;
      bottom: 0;
      margin: 0;
      color: var(--ink);
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: clamp(4px, 0.7vw, 8px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: 0.02em;
      white-space: pre;
      font-variant-ligatures: none;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .magnolia-ascii-b {
      opacity: 0;
    }

    .wordmark {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 400;
      margin: 0 0 2.75rem;
      opacity: 0.75;
    }

    p.lede {
      font-size: 1.2rem;
      margin: 0 auto 3rem;
      text-wrap: pretty;
    }

    .lede-first {
      display: block;
      white-space: nowrap;
    }

    .contact {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    .contact .emails {
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin-top: 0.4rem;
      font-size: clamp(0.7rem, 2.5vw, 1.05rem);
      white-space: nowrap;
    }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(51, 64, 58, 0.35);
      padding-bottom: 1px;
      transition: border-color 0.2s ease;
    }

    a:hover {
      border-bottom-color: var(--ink);
    }

    .sep {
      opacity: 0.4;
      margin: 0 0.55rem;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes magnolia-appear {
      to { opacity: var(--magnolia-opacity); }
    }

    @media (max-width: 40rem) {
      :root { --magnolia-opacity: 0.32; }

      main {
        padding: 2.25rem 1.35rem 3.5rem;
      }

      .wordmark {
        font-size: clamp(1.05rem, 5.2vw, 1.45rem);
        letter-spacing: 0.14em;
        margin-bottom: 1.75rem;
      }

      .lede-first {
        white-space: normal;
      }

      p.lede {
        font-size: 1.05rem;
        margin: 0 0 2.1rem;
        text-align: left;
      }

      .contact {
        font-size: 1rem;
        text-align: left;
      }

      .contact .emails {
        justify-content: flex-start;
        white-space: normal;
        font-size: 0.95rem;
      }

      .magnolia {
        inset: 0;
        width: auto;
        height: auto;
        right: 0;
        bottom: 0;
      }

      .magnolia-veil {
        background: radial-gradient(
          ellipse 125% 115% at 100% 100%,
          transparent 0%,
          transparent 16%,
          rgba(247, 244, 238, 0.38) 38%,
          rgba(247, 244, 238, 0.78) 62%,
          var(--bg) 86%
        );
      }

      .magnolia-ascii {
        font-size: max(2.5vw, 1.2vh);
        transform: none;
      }
    }

    @media (max-width: 30rem) {
      p.lede { font-size: 1.02rem; }
      .sep { margin: 0 0.35rem; }
      .wordmark {
        letter-spacing: 0.11em;
        font-size: clamp(0.98rem, 5vw, 1.25rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .magnolia-art {
        animation: none;
        opacity: var(--magnolia-opacity);
      }
    }
  </style>
</head>
<body>
  <div class="magnolia" aria-hidden="true">
    <div class="magnolia-art">
      <pre class="magnolia-ascii magnolia-ascii-a"></pre>
      <pre class="magnolia-ascii magnolia-ascii-b"></pre>
    </div>
    <div class="magnolia-veil"></div>
  </div>
  <main>
    <h1 class="wordmark">Magnolia Research</h1>
    <p class="lede">
      <span class="lede-first">Magnolia Research is pushing the frontier of AI capablities through data.</span>
      We provide high-quality post-training data for technical tasks.
    </p>
    <p class="contact">
      Partner with us
      <span class="emails">
        <a href="mailto:team@magnoliaresearch.ai">team@magnoliaresearch.ai</a>
      </span>
    </p>
  </main>
  <script src="magnolia-ascii.js"></script>
  <script>
    (function () {
      var frames = window.MAGNOLIA_ASCII;
      var a = document.querySelector(".magnolia-ascii-a");
      var b = document.querySelector(".magnolia-ascii-b");
      if (!frames || !frames.length || !a || !b) return;
      a.textContent = frames[0];
      b.textContent = frames[1] || frames[0];

      var last = frames.length - 1;
      var cycle = last * 2;
      var msPerStep = 220;
      var period = cycle * msPerStep;
      var nowFn = (window.performance && performance.now)
        ? function () { return performance.now(); }
        : function () { return Date.now(); };
      var t0 = nowFn();
      var shownA = -1;
      var shownB = -1;
      var usingRaf = typeof requestAnimationFrame === "function";

      function pingPong(p) {
        return p <= last ? p : cycle - p;
      }

      function tick(now) {
        if (now == null || isNaN(now)) now = nowFn();
        var t = ((now - t0) % period) / msPerStep;
        if (t < 0) t += period / msPerStep;
        var i0 = Math.floor(t);
        var mix = t - i0;
        var f0 = pingPong(i0 % cycle);
        var f1 = pingPong((i0 + 1) % cycle);
        if (f0 !== shownA) {
          a.textContent = frames[f0];
          shownA = f0;
        }
        if (f1 !== shownB) {
          b.textContent = frames[f1];
          shownB = f1;
        }
        a.style.opacity = String(1 - mix);
        b.style.opacity = String(mix);
        if (usingRaf) requestAnimationFrame(tick);
      }

      if (usingRaf) {
        requestAnimationFrame(tick);
      } else {
        setInterval(function () { tick(nowFn()); }, 50);
      }
    })();
  </script>
</body>
</html>
