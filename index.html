<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magnolia Research</title>
  <meta name="description" content="Magnolia Research helps AI labs push their frontier model capabilities by building targeted post-training data and reinforcement learning environments grounded in real engineering and research workflows." />
  <style>
    :root {
      --bg: #f7f4ee;   /* warm off-white */
      --ink: #33403a;  /* deep muted green */
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    main {
      max-width: 40rem;
      width: 100%;
      padding: 3rem 1.5rem;
      text-align: center;
      animation: fade-in 1.4s ease both;
    }

    .wordmark {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-weight: 400;
      margin: 0 0 2.75rem;
      opacity: 0.75;
    }

    p.lede {
      font-size: 1.2rem;
      margin: 0 auto 3rem;
      text-wrap: pretty;
    }

    .contact {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    .contact .emails {
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin-top: 0.4rem;
      font-size: clamp(0.7rem, 2.5vw, 1.05rem);
      white-space: nowrap;
    }

    a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid rgba(51, 64, 58, 0.35);
      padding-bottom: 1px;
      transition: border-color 0.2s ease;
    }

    a:hover {
      border-bottom-color: var(--ink);
    }

    .sep {
      opacity: 0.4;
      margin: 0 0.55rem;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 30rem) {
      p.lede { font-size: 1.1rem; }
      .sep { margin: 0 0.35rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="wordmark">Magnolia Research</h1>
    <p class="lede">

      Magnolia Research is pushing the frontier of AI capablities through data.
      We provide high-quality post-training data for technical tasks.
    </p>
    <p class="contact">
      Partner with us
      <span class="emails">
        <a href="mailto:team@magnoliaresearch.ai">team@magnoliaresearch.ai</a>
      </span>
    </p>
  </main>
</body>
</html>
